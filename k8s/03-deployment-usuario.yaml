# Deployment del servicio usuario (solo consulta).
# Codigo e imagen PROPIOS e independientes del admin:
# usuario/app.js + usuario/Dockerfile -> luisraga12/biblioteca-usuario:1.0
# 2 replicas: cumple el minimo de la rubrica y da alta disponibilidad.
# Stateless: sin volumen persistente, solo emptyDir en /tmp.
# NO lleva APP_MODE: este servicio ya es solo usuario por su propio codigo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblioteca-usuario
  namespace: pruebas
  labels:
    app: biblioteca
    modulo: usuario
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biblioteca
      modulo: usuario
  template:
    metadata:
      labels:
        app: biblioteca
        modulo: usuario
    spec:
      containers:
        - name: usuario
          image: luisraga12/biblioteca-usuario:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: "mysql-svc"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /salud
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /salud
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
