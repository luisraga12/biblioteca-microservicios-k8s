# Secret con las credenciales de MySQL.
# Los valores estan en base64 (base64 es codificacion, no cifrado: no es
# seguro por si solo, pero es lo que exige la actividad y lo que Kubernetes
# espera en un Secret de tipo Opaque).
# Generados con: printf 'valor' | base64
#   biblioteca  -> YmlibGlvdGVjYQ==
#   biblio_user -> YmlibGlvX3VzZXI=
#   Biblio2026! -> QmlibGlvMjAyNiE=
#   Root2026!   -> Um9vdDIwMjYh
# SON CONTRASENAS DE EJEMPLO, SOLO PARA ESTA ACTIVIDAD. Cambiarlas antes
# de cualquier uso real y no reutilizarlas en ningun otro servicio.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: pruebas
  labels:
    app: biblioteca
type: Opaque
data:
  MYSQL_DATABASE: YmlibGlvdGVjYQ==
  MYSQL_USER: YmlibGlvX3VzZXI=
  MYSQL_PASSWORD: QmlibGlvMjAyNiE=
  MYSQL_ROOT_PASSWORD: Um9vdDIwMjYh
